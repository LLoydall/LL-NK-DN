# Deterministic engine (Python FastAPI). Internal-only service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  labels:
    app: engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine
  template:
    metadata:
      labels:
        app: engine
    spec:
      containers:
        - name: engine
          # Replaced by Cloud Build (see cloudbuild.yaml deploy step)
          image: ENGINE_IMAGE
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: engine
  labels:
    app: engine
spec:
  selector:
    app: engine
  ports:
    - name: http
      port: 8080
      targetPort: 8080
