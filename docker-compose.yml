# Local dev parity with the GKE topology: qdrant + engine + app.
# For day-to-day dev prefer running server (`npm run dev`) and web (`npm run dev`)
# natively and only the two backing services here:
#   docker compose up qdrant engine
#
# Full stack in containers:
#   docker compose up --build

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage

  engine:
    build:
      context: ./engine
    ports:
      - "8081:8080"
    environment:
      DATA_DIR: "/data"
      UPLOADS_DIR: "/uploads"
      MAPPING_WORKBOOK: "/data/output/Tranche 1 - reference and verified loader v4c (anonymised).xlsx"
    volumes:
      # Reference workbook and source GL are mounted, not baked into the image
      - ./sample-data-and-call-transcripts/02-investor-level-gl-to-loader:/data:ro
      # Workbooks pushed by the app at ingest (pipeline verification). Top-level
      # path: a mount point can't be created inside the read-only /data mount.
      - engine-uploads:/uploads

  app:
    build:
      context: .
    depends_on:
      - qdrant
      - engine
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      ENGINE_URL: http://engine:8080
    volumes:
      # ADC for local Vertex AI access (gcloud auth application-default login)
      - ~/.config/gcloud/application_default_credentials.json:/home/node/.config/gcloud/application_default_credentials.json:ro
      # Sample data is ingested at runtime, not baked into the image; mount it
      # where the ingest path guard expects it (repo root = /app in the image)
      - ./sample-data-and-call-transcripts:/app/sample-data-and-call-transcripts:ro

volumes:
  qdrant-storage:
  engine-uploads:
